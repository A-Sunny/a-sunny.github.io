<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Forza + Manual BLE Tank</title>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e293b; --card:#111a2e; --edge:#2b3a55;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#22d3ee; --accent2:#818cf8;
    --stop:#ef4444; --ok:#22c55e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;min-height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);
    background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg1) 60%);
    display:flex;align-items:center;justify-content:center;
    touch-action:none;padding:14px;
  }
  .app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
  .card{
    background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,0));
    background-color:var(--card);
    border:1px solid var(--edge);border-radius:22px;padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .top-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  h1{font-size:1.15rem;margin:0;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  .bt-btn{
    width:100%;padding:12px;border-radius:12px;border:none;
    font-size:.95rem;font-weight:700;background:var(--accent);color:#06121f;cursor:pointer;
  }
  .status-row{display:flex;justify-content:space-between;margin-top:10px;font-size:.8rem;color:var(--muted)}
  .badge{padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:#1e293b;color:var(--muted)}
  .badge.on{background:var(--ok);color:#052e16}

  /* 9-Button Manual Touch Pad */
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .btn{
    aspect-ratio:1/1;border:1px solid var(--edge);border-radius:18px;
    background:linear-gradient(180deg,#1b2742,#141d33);
    color:var(--text);font-size:1.8rem;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s;
    box-shadow:0 5px 0 #0a1020,0 8px 14px rgba(0,0,0,.35);
  }
  .btn svg{width:42%;height:42%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .btn.active{
    transform:translateY(4px);
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    color:#06121f;box-shadow:0 1px 0 #0a1020,0 0 22px rgba(34,211,238,.55);
  }
  .btn.stop{color:#fff;background:linear-gradient(180deg,#f87171,var(--stop));border-color:#7f1d1d}
  .btn.stop.active{box-shadow:0 1px 0 #7f1d1d,0 0 22px rgba(239,68,68,.6)}
  .btn.stop svg{fill:currentColor;stroke:none}

  .speed-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .speed-head b{font-size:1.4rem;color:var(--accent)}
  .speed-head small{color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-size:.7rem}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;outline:none;
    background:linear-gradient(90deg,var(--accent2),var(--accent)) 0/var(--fill,80%) 100% no-repeat,#0b1324;
    border:1px solid var(--edge);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:28px;height:28px;border-radius:50%;
    background:#fff;border:4px solid var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;text-align:center}
  .bar-box{background:#0b1324;border:1px solid var(--edge);padding:8px;border-radius:12px;font-size:1.1rem;font-weight:700;color:var(--accent)}
  .hint{text-align:center;font-size:.72rem;color:var(--muted);line-height:1.4}
</style>
</head>
<body>
<div class="app">

  <div class="card">
    <div class="top-head">
      <h1>ESP32 <span>BLE TANK</span></h1>
    </div>
    <button class="bt-btn" id="btBtn">Connect Bluetooth Tank</button>
    <div class="status-row">
      <span>Bluetooth: <b class="badge" id="btStat">Offline</b></span>
      <span>Gamepad: <b class="badge" id="gpStat">None</b></span>
    </div>
  </div>

  <!-- Manual Touch Pad -->
  <div class="card">
    <div class="pad" id="pad">
      <div class="btn" data-d="FL"><svg viewBox="0 0 24 24" style="transform:rotate(-45deg)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      <div class="btn" data-d="F"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      <div class="btn" data-d="FR"><svg viewBox="0 0 24 24" style="transform:rotate(45deg)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>

      <div class="btn" data-d="L"><svg viewBox="0 0 24 24" style="transform:rotate(-90deg)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      <div class="btn stop" data-d="S"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></div>
      <div class="btn" data-d="R"><svg viewBox="0 0 24 24" style="transform:rotate(90deg)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>

      <div class="btn" data-d="BL"><svg viewBox="0 0 24 24" style="transform:rotate(-135deg)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      <div class="btn" data-d="B"><svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
      <div class="btn" data-d="BR"><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
    </div>
  </div>

  <!-- Speed Slider & Live Motor Output -->
  <div class="card">
    <div class="speed-head"><small>Max Speed / Manual Speed</small><b id="sv">80%</b></div>
    <input type="range" id="speed" min="20" max="100" value="80">
    <div class="bars">
      <div class="bar-box">L: <span id="lVal">0</span>%</div>
      <div class="bar-box">R: <span id="rVal">0</span>%</div>
    </div>
  </div>

  <div class="hint">
    <b>Forza Gamepad:</b> R2 = Gas &middot; L2 = Brake/Rev &middot; L-Stick = Sharp Steer / Axis Spin<br>
    <b>Manual:</b> Hold On-Screen Pad or W A S D / Arrow Keys (Space = Stop)
  </div>
</div>

<script>
const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
const CHAR_UUID    = "19b10001-e8f2-537e-4f6c-d104768a1214";

// Higher = sharper cornering while moving (1.15 stops inside belt at 87% stick and slightly reverses at 100%)
const TURN_SHARPNESS = 1.15;

// Manual diagonal inside-track ratio (0.0 locks inside belt completely for a sharp pivot turn)
const MANUAL_CURVE_RATIO = 0.0;

let bleChar = null, busy = false, manualDir = 'S';
const btBtn = document.getElementById('btBtn');
const btStat = document.getElementById('btStat');
const gpStat = document.getElementById('gpStat');
const speed = document.getElementById('speed'), sv = document.getElementById('sv');
const lVal = document.getElementById('lVal'), rVal = document.getElementById('rVal');

function fillSlider() {
  speed.style.setProperty('--fill', speed.value + '%');
  sv.textContent = speed.value + '%';
}
speed.addEventListener('input', fillSlider);
fillSlider();

// ---------- Web Bluetooth Connection ----------
btBtn.onclick = async () => {
  try {
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ name: "ESP32-Tank" }],
      optionalServices: [SERVICE_UUID]
    });
    dev.addEventListener('gattserverdisconnected', () => {
      bleChar = null;
      btStat.textContent = "Offline";
      btStat.classList.remove('on');
    });
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(SERVICE_UUID);
    bleChar = await svc.getCharacteristic(CHAR_UUID);
    btStat.textContent = "Connected";
    btStat.classList.add('on');
  } catch (e) {
    alert("BLE Error: " + e.message);
  }
};

// ---------- Manual Touch Pad & Keyboard ----------
function setManualDir(d) {
  manualDir = d;
  document.querySelectorAll('.btn').forEach(b =>
    b.classList.toggle('active', b.dataset.d === d && d !== 'S')
  );
}

document.querySelectorAll('.btn').forEach(b => {
  const d = b.dataset.d;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    b.setPointerCapture(e.pointerId);
    setManualDir(d);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev =>
    b.addEventListener(ev, () => { if (d !== 'S' && manualDir === d) setManualDir('S'); })
  );
});

const keys = new Set();
function dirFromKeys() {
  const f = keys.has('w') || keys.has('arrowup'), bk = keys.has('s') || keys.has('arrowdown');
  const l = keys.has('a') || keys.has('arrowleft'), r = keys.has('d') || keys.has('arrowright');
  if (f && l) return 'FL'; if (f && r) return 'FR';
  if (bk && l) return 'BL'; if (bk && r) return 'BR';
  if (f) return 'F'; if (bk) return 'B'; if (l) return 'L'; if (r) return 'R';
  return 'S';
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') { keys.clear(); setManualDir('S'); return; }
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
    e.preventDefault(); keys.add(k); setManualDir(dirFromKeys());
  }
});
addEventListener('keyup', e => { keys.delete(e.key.toLowerCase()); setManualDir(dirFromKeys()); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setManualDir('S'); });
addEventListener('blur', () => setManualDir('S'));

function getManualTracks(d, cap) {
  let l = 0, r = 0;
  if      (d === 'F')  { l =  1;                   r =  1; }
  else if (d === 'B')  { l = -1;                   r = -1; }
  else if (d === 'L')  { l = -1;                   r =  1; }
  else if (d === 'R')  { l =  1;                   r = -1; }
  else if (d === 'FL') { l =  MANUAL_CURVE_RATIO;  r =  1; }
  else if (d === 'FR') { l =  1;                   r =  MANUAL_CURVE_RATIO; }
  else if (d === 'BL') { l = -MANUAL_CURVE_RATIO;  r = -1; }
  else if (d === 'BR') { l = -1;                   r = -MANUAL_CURVE_RATIO; }
  return [Math.round(l * cap), Math.round(r * cap)];
}

// ---------- Forza Horizon Gamepad Reader ----------
function deadzone(v, dz = 0.12) {
  if (Math.abs(v) < dz) return 0;
  return (v - Math.sign(v) * dz) / (1 - dz);
}

function getControlOutput() {
  const cap = parseInt(speed.value, 10);

  // 1. If manual touch pad or keyboard is actively held, prioritize it
  if (manualDir !== 'S') {
    return getManualTracks(manualDir, cap);
  }

  // 2. Otherwise read Fantech Shooter III Gamepad
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = gps[0] || gps[1] || gps[2] || gps[3];
  if (!gp) {
    gpStat.textContent = "None";
    gpStat.classList.remove('on');
    return [0, 0];
  }
  gpStat.textContent = "Active";
  gpStat.classList.add('on');

  // Face buttons A / B / X / Y = immediate brake/stop
  if (gp.buttons[0]?.pressed || gp.buttons[1]?.pressed || gp.buttons[2]?.pressed || gp.buttons[3]?.pressed) {
    return [0, 0];
  }

  // Forza triggers: R2 (button 7) = Forward gas, L2 (button 6) = Brake/Reverse
  const r2 = gp.buttons[7]?.value || 0;
  const l2 = gp.buttons[6]?.value || 0;
  let throttle = r2 - l2;

  // Allow D-Pad Up/Down as fallback throttle if triggers aren't held
  if (Math.abs(throttle) < 0.02) {
    if (gp.buttons[12]?.pressed) throttle = 1.0;
    else if (gp.buttons[13]?.pressed) throttle = -1.0;
  }

  // Steering: Left Stick X-axis (axis 0) or D-Pad Left/Right
  let steer = deadzone(gp.axes[0] || 0);
  if (gp.buttons[14]?.pressed) steer = -1.0;
  if (gp.buttons[15]?.pressed) steer =  1.0;

  let l = 0, r = 0;

  if (Math.abs(throttle) < 0.02) {
    // Zero throttle + Left Stick Left/Right = Spin in place on axis
    l = steer;
    r = -steer;
  } else {
    // Moving + Steering = Sharp differential cornering
    l = throttle * (steer > 0 ? 1.0 : 1.0 + steer * TURN_SHARPNESS);
    r = throttle * (steer < 0 ? 1.0 : 1.0 - steer * TURN_SHARPNESS);
  }

  const lPct = Math.round(Math.max(-1, Math.min(1, l)) * cap);
  const rPct = Math.round(Math.max(-1, Math.min(1, r)) * cap);
  return [lPct, rPct];
}

// 40 Hz (25 ms) zero-ACK BLE loop
setInterval(async () => {
  const [l, r] = getControlOutput();
  lVal.textContent = l;
  rVal.textContent = r;

  if (!bleChar || busy) return;
  busy = true;
  try {
    const packet = new Int8Array([l, r]);
    if (bleChar.writeValueWithoutResponse) {
      await bleChar.writeValueWithoutResponse(packet);
    } else {
      await bleChar.writeValue(packet);
    }
  } catch (e) {}
  busy = false;
}, 25);
</script>
</body>
</html>
